<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Register – SmartFASTag</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link rel="stylesheet" href="../css/animations.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    .auth-page {
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:100px 24px 60px; position:relative; overflow:hidden;
    }
    .auth-glow2 {
      position:fixed; border-radius:50%; filter:blur(120px); opacity:.15;
      width:500px; height:500px;
      background:radial-gradient(circle,var(--teal),transparent 70%);
      bottom:-100px; right:-100px;
      animation:floatGlow 10s ease-in-out infinite reverse; z-index:0;
    }
    .auth-box {
      background:var(--card-bg); border:1px solid var(--border); border-radius:24px;
      padding:44px 40px; width:100%; max-width:520px; position:relative; z-index:1;
    }
    .auth-logo { text-align:center; margin-bottom:28px; }
    .auth-logo .logo { justify-content:center; font-size:1.4rem; }
    .auth-box h2 { text-align:center; margin-bottom:24px; font-size:1.5rem; }
    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .form-err { font-size:.78rem; min-height:16px; display:block; margin-top:3px; }
    .vehicle-section { border:1px solid var(--border); border-radius:14px; padding:20px; margin-top:8px; }
    .vehicle-section h4 { font-size:.88rem; color:#94A3B8; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
    .step-indicator { display:flex; gap:0; margin-bottom:28px; }
    .step-dot { flex:1; height:4px; background:rgba(255,255,255,.08); border-radius:2px; margin:0 2px; }
    .step-dot.done { background:var(--blue); }
    .step-dot.active { background:linear-gradient(90deg,var(--blue),var(--teal)); }
    .auth-footer { text-align:center; margin-top:24px; font-size:.85rem; color:#64748B; }
    .auth-footer a { color:var(--blue2); }
    @media(max-width:480px){ .auth-box{padding:28px 18px} .two-col{grid-template-columns:1fr} }
  </style>
</head>
<body>
<div class="auth-glow2"></div>
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="logo"><span class="logo-icon"><i class="fas fa-road"></i></span> Smart<b>FASTag</b></div>
    </div>
    <h2>Create Account 🚀</h2>

    <!-- Step indicator -->
    <div class="step-indicator">
      <div class="step-dot done" id="dot1"></div>
      <div class="step-dot active" id="dot2"></div>
      <div class="step-dot" id="dot3"></div>
    </div>

    <form id="regForm" onsubmit="handleRegister(event)">
      <!-- Personal Details -->
      <div class="two-col">
        <div class="form-group">
          <label>Full Name</label>
          <input class="form-control" name="name" type="text" placeholder="Ravi Kumar" required/>
          <span class="form-err" data-err="name"></span>
        </div>
        <div class="form-group">
          <label>Mobile Number</label>
          <input class="form-control" name="mobile" type="tel" placeholder="98765 43210" maxlength="10" required/>
          <span class="form-err" data-err="mobile"></span>
        </div>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input class="form-control" name="email" type="email" placeholder="you@gmail.com" required/>
        <span class="form-err" data-err="email"></span>
      </div>
      <div class="two-col">
        <div class="form-group">
          <label>Password</label>
          <input class="form-control" name="password" id="pwdField" type="password" placeholder="Min 8 chars" required/>
          <span class="form-err" data-err="password"></span>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input class="form-control" name="confirm" type="password" placeholder="Repeat password" required/>
          <span class="form-err" data-err="confirm"></span>
        </div>
      </div>

      <!-- Vehicle Details -->
      <div class="vehicle-section">
        <h4><i class="fas fa-car" style="color:var(--teal)"></i> Vehicle Details</h4>
        <div class="two-col">
          <div class="form-group" style="margin-bottom:0">
            <label>Vehicle Number</label>
            <input class="form-control" name="vehicle" type="text" placeholder="TN38AB1234" style="text-transform:uppercase" required/>
            <span class="form-err" data-err="vehicle"></span>
          </div>
          <div class="form-group" style="margin-bottom:0">
            <label>Vehicle Type</label>
            <select class="form-control" name="vtype">
              <option value="">Select type</option>
              <option>Car / Jeep</option>
              <option>Motorcycle</option>
              <option>LCV / Van</option>
              <option>Bus / Truck</option>
              <option>Multi-Axle</option>
            </select>
          </div>
        </div>
      </div>

      <div class="form-group" style="margin-top:20px;display:flex;align-items:flex-start;gap:10px">
        <input type="checkbox" id="terms" required style="margin-top:3px;flex-shrink:0"/>
        <label for="terms" style="font-size:.84rem;color:#94A3B8;cursor:pointer">
          I agree to the <a href="#" style="color:var(--blue2)">Terms of Service</a> and
          <a href="#" style="color:var(--blue2)">Privacy Policy</a>. I authorize FASTag auto-deductions from my registered UPI.
        </label>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:13px;font-size:1rem;margin-top:8px" id="regBtn">
        <i class="fas fa-user-plus"></i> Create Account
      </button>
    </form>

    <div class="auth-footer">Already have an account? <a href="login.html">Login here</a></div>
  </div>
</div>

<!-- SUCCESS OVERLAY -->
<div class="modal-overlay" id="successOverlay">
  <div class="modal" style="max-width:380px">
    <div style="font-size:3rem;margin-bottom:16px">🎉</div>
    <h2>Account Created!</h2>
    <p style="margin-bottom:24px">Your FASTag account and vehicle have been registered. Welcome to the future of toll collection!</p>
    <a href="dashboard.html" class="btn btn-primary" style="justify-content:center;width:100%">
      <i class="fas fa-tachometer-alt"></i> Go to Dashboard
    </a>
  </div>
</div>

<script src="../js/main.js"></script>
<script>
function handleRegister(e) {
  e.preventDefault();
  const f = e.target;
  let ok = true;
  const clearErr = id => { const el=document.querySelector(`[data-err="${id}"]`); if(el)el.textContent=''; };
  const setErr   = (id,msg) => { const el=document.querySelector(`[data-err="${id}"]`); if(el){el.textContent=msg;el.style.color='#F87171';} ok=false; };

  ['name','mobile','email','password','confirm','vehicle'].forEach(clearErr);

  if (!f.name.value.trim())       setErr('name','Name is required');
  if (!/^\d{10}$/.test(f.mobile.value.trim())) setErr('mobile','Enter 10-digit mobile');
  if (!f.email.value.includes('@')) setErr('email','Enter valid email');
  if (f.password.value.length < 8) setErr('password','Min 8 characters');
  if (f.password.value !== f.confirm.value) setErr('confirm','Passwords do not match');
  if (!f.vehicle.value.trim())    setErr('vehicle','Vehicle number required');

  if (!ok) return;

  const btn = document.getElementById('regBtn');
  btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Creating account…';

  // Animate steps
  document.getElementById('dot2').className='step-dot done';
  document.getElementById('dot3').className='step-dot active';

  setTimeout(()=>{
    document.getElementById('dot3').className='step-dot done';
    document.getElementById('successOverlay').classList.add('open');
    btn.disabled=false;
  }, 2000);
}
// Vehicle number uppercase
document.querySelector('[name="vehicle"]').addEventListener('input', function(){ this.value=this.value.toUpperCase(); });
</script>
</body>
</html>
